openapi: 3.1.0
info:
  title: tinysonic JSON API
  version: 1.0.0
  summary: Accounts, API keys, device pairing, passkeys, single sign-on and track analysis.
  description: |
    JSON endpoints under `/api`, used by the web account page and the Android
    app. They are not part of the Subsonic API: the Subsonic endpoints under
    `/rest` are listed in `docs/opensubsonic-endpoints.md`.

    Errors use one shape, `{"error": "<message>"}`, with an HTTP status code.

    Paths are relative to the server root. With `base_path` set, prefix every
    path with it, for example `/folksonic/api/keys`.

    `/login` and `/account` are HTML pages and are not described here.
servers:
  - url: /
    description: Server root (or the base_path prefix, when set)
security:
  - bearerAuth: []
  - apiKeyQuery: []
tags:
  - name: Accounts
  - name: API keys
  - name: Device pairing
  - name: Passkeys
  - name: Single sign-on
  - name: Library
    description: Library administration for librarians. Other accounts get 403.
  - name: Analysis
    description: >-
      Per-track audio analysis computed in the background by the tools
      assigned in the `[analysis]` config table. Advertised as the
      OpenSubsonic extension `tinysonicAnalysis`; version 2 adds the
      fingerprint object and `/api/duplicates`.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session token from `/api/login`, a passkey sign-in, a registration, or `/api/oidc/exchange` (web). Sent as `Authorization: Bearer <token>`.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: Device API key (`tsk_…`), from `/api/keys`, pairing or single sign-on (app). Also accepted as a form field.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Ceremony:
      name: ceremony
      in: query
      required: true
      description: Ceremony id returned by the matching `begin` call. Single-use, expires after 5 minutes.
      schema:
        type: string
  schemas:
    LibraryJob:
      type: object
      description: >-
        The running or last job: `bpm` from the BPM buttons, `analysis` for a
        recalculation (`recalc`) or the automatic analysis after scans
        (`pending`). Only `running` is set before the first job.
      properties:
        kind: {type: string, enum: [bpm, analysis]}
        mode: {type: string, enum: [missing, all, recalc, pending]}
        running: {type: boolean}
        total: {type: integer}
        done: {type: integer}
        updated: {type: integer, description: Songs with a changed value.}
        failed: {type: integer}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        error: {type: string, nullable: true, description: '"stopped" when cancelled.'}
    Analysis:
      type: object
      properties:
        id: {type: string}
        fileVersion: {type: string, description: '`sha256:…` of the file the values belong to; changes when the file changes.'}
        waveform:
          type: object
          nullable: true
          properties:
            bins: {type: integer}
            peaks: {type: array, items: {type: integer, minimum: 0, maximum: 255}, description: Peak per bin, the loudest bin is 255.}
        beats:
          type: object
          nullable: true
          properties:
            timesMs: {type: array, items: {type: integer}}
            downbeatIndexes: {type: array, nullable: true, items: {type: integer}, description: Indexes into timesMs of beats that start a bar.}
        bpm:
          type: object
          nullable: true
          properties:
            value: {type: number}
            confidence: {type: number, nullable: true, minimum: 0, maximum: 1, description: '`null` for BPM from tags.'}
        key:
          type: object
          nullable: true
          properties:
            tonic: {type: string, examples: [A, F#, Bb]}
            mode: {type: string, enum: [major, minor]}
            confidence: {type: number, nullable: true, minimum: 0, maximum: 1}
        loudness:
          type: object
          nullable: true
          properties:
            integratedLufs: {type: number, nullable: true}
            truePeakDbtp: {type: number, nullable: true}
        silence:
          type: object
          nullable: true
          properties:
            leadMs: {type: integer, nullable: true}
            tailMs: {type: integer, nullable: true}
        fingerprint:
          type: object
          nullable: true
          description: Chromaprint fingerprint of the first 120 s. Only compare fingerprints with the same algorithm and version.
          properties:
            algorithm: {type: string, enum: [chromaprint]}
            version: {type: integer, description: 'Chromaprint algorithm version, 2 for the fpcalc/AcoustID default.'}
            durationSec: {type: number, description: Seconds of audio fingerprinted.}
            value: {type: string, description: 'Compressed fingerprint, base64 as fpcalc prints it.'}
        pending:
          type: array
          items: {type: string}
          description: Only in 202 responses.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Session:
      type: object
      required: [token, username, role]
      properties:
        token:
          type: string
          description: Bearer session token, valid for 30 days.
        username:
          type: string
        role:
          type: string
          enum: [librarian, user]
    ApiKeyCreated:
      type: object
      required: [apiKey, label, expiresAt]
      properties:
        apiKey:
          type: string
          description: Shown once. It cannot be retrieved later.
        label:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    ApiKeyInfo:
      type: object
      required: [id, label, prefix, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        prefix:
          type: string
          description: First characters of the key, for recognition.
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
    PairingStart:
      type: object
      required: [token, uri, expiresIn]
      properties:
        token:
          type: string
        uri:
          type: string
          description: '`tinysonic://pair?server=<base_url>&token=<token>`. This is what the QR code encodes.'
        expiresIn:
          type: integer
          description: Seconds until the token expires (300).
    Passkey:
      type: object
      required: [id, label, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
          description: Empty when the passkey was added without a name.
        createdAt:
          type: string
    Identity:
      type: object
      required: [id, issuer, subject, createdAt]
      properties:
        id:
          type: integer
        issuer:
          type: string
        subject:
          type: string
          description: The provider's stable user identifier.
        createdAt:
          type: string
    WebAuthnOptions:
      type: object
      required: [ceremony, options]
      properties:
        ceremony:
          type: string
        options:
          type: object
          description: WebAuthn `publicKey` creation or request options, passed to the browser unchanged.
    WebAuthnCredential:
      type: object
      description: The credential returned by `navigator.credentials.create()` or `.get()`, serialised as JSON. Passed to the library unchanged.
      additionalProperties: true
  responses:
    Forbidden:
      description: The caller is not a librarian.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid JSON body or invalid value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session or API key, or a sign-in that has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource that belongs to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request would break an account rule, such as removing the last sign-in method or a username that is taken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The feature is not configured on this server (passkeys need `base_url`; single sign-on needs the `oidc` block) or the identity provider cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /api/register:
    post:
      tags: [Accounts]
      summary: Create an account with a password
      description: |
        With `invite`, the account is active at once and the response is a
        session. Without `invite`, the account is pending and needs
        `allow_registration` on the server; an administrator approves it with
        `tinysonic user approve`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                invite:
                  type: string
                  description: Invitation code. Optional.
      responses:
        '201':
          description: Account created and signed in (invitation given).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [active]
        '202':
          description: Account created and pending approval (no invitation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Registration is disabled, or the invitation is invalid, used, expired or bound to another username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/login:
    post:
      tags: [Accounts]
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/logout:
    post:
      tags: [Accounts]
      summary: End the session behind the Bearer token
      responses:
        '200':
          description: Session ended (or no token was sent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['signed out']
  /api/keys:
    get:
      tags: [API keys]
      summary: List the caller's API keys
      responses:
        '200':
          description: Keys, without their secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [API keys]
      summary: Create an API key
      description: The key is returned once. The Android app and other clients use it as the `apiKey` parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Name for the key. Defaults to "api key".
                expires_days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  description: Lifetime in days. Zero (default) means the key does not expire.
      responses:
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [API keys]
      summary: Revoke one of the caller's keys
      responses:
        '200':
          description: Key revoked. The key stops working at once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [revoked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pair/start:
    post:
      tags: [Device pairing]
      summary: Create a pairing token and its QR payload
      description: The token is single-use and expires after 5 minutes. The app redeems it at `/api/pair/complete`.
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pair/complete:
    post:
      tags: [Device pairing]
      summary: Redeem a pairing token for a device API key
      description: No authentication. The single-use token is the credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                device:
                  type: string
                  description: Name for the key the app is given.
      responses:
        '200':
          description: Key issued.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, username, server]
                properties:
                  apiKey:
                    type: string
                  username:
                    type: string
                  server:
                    type: string
                    description: The address the app should use, from `base_url` or the request host.
        '401':
          description: Token unknown, used or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pair/qr:
    post:
      tags: [Device pairing]
      summary: Create a pairing token and return its QR code
      description: |
        Creates the same token as `/api/pair/start` and returns it as a QR
        code. SVG is the default. PNG is returned when the request has
        `Accept: image/png` (and not `image/svg+xml`) or `?format=png`.
        Responses are not cached.
      responses:
        '200':
          description: QR code image.
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkeys:
    get:
      tags: [Passkeys]
      summary: List the caller's passkeys
      responses:
        '200':
          description: Passkeys, without key material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkeys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Passkeys]
      summary: Remove one of the caller's passkeys
      description: Refused when it would leave the account with no sign-in method (no password, no other passkey and no linked identity).
      responses:
        '200':
          description: Passkey removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [removed]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/passkey/register/begin:
    post:
      tags: [Passkeys]
      summary: Start adding a passkey to the signed-in account
      responses:
        '200':
          description: WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/passkey/register/finish:
    post:
      tags: [Passkeys]
      summary: Store the passkey created in the browser
      parameters:
        - $ref: '#/components/parameters/Ceremony'
        - name: label
          in: query
          required: false
          description: Name for the passkey. Up to 64 characters.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '201':
          description: Passkey stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['passkey added']
        '400':
          description: Ceremony expired, belongs to another account, or the passkey was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkey/login/begin:
    post:
      tags: [Passkeys]
      summary: Start a passkey sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '200':
          description: WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '401':
          description: No active account with a passkey under that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/passkey/login/finish:
    post:
      tags: [Passkeys]
      summary: Verify the signed challenge and issue a session
      security: []
      parameters:
        - $ref: '#/components/parameters/Ceremony'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/register/passkey/begin:
    post:
      tags: [Passkeys]
      summary: Start sign-up with an invitation and a passkey, without a password
      description: Checks the invitation and username, then returns options. Nothing is written until the passkey is verified, so an abandoned attempt uses no invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, invite]
              properties:
                username:
                  type: string
                invite:
                  type: string
      responses:
        '200':
          description: WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The invitation is invalid, used, expired or bound to another username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/register/passkey/finish:
    post:
      tags: [Passkeys]
      summary: Verify the passkey, create the account and sign in
      security: []
      parameters:
        - $ref: '#/components/parameters/Ceremony'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '201':
          description: Account created and signed in. The invitation is spent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [active]
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The invitation was used or became invalid while the passkey was being created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/oidc/status:
    get:
      tags: [Single sign-on]
      summary: Whether single sign-on is configured
      security: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
  /api/oidc/begin:
    post:
      tags: [Single sign-on]
      summary: Start a single sign-on
      description: |
        `mode` selects what the callback does:
        - `signin` (default): sign in an account already linked to the identity.
        - `link`: attach the identity to the signed-in account. Needs a session or API key.
        - `invite`: create an account bound to `username`, spending `invite`.

        The browser (or app) then opens the returned `url`. PKCE and a nonce are
        used, and the state is single-use and expires after 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [signin, link, invite]
                  default: signin
                client:
                  type: string
                  enum: [web, app]
                  default: web
                  description: '`web` returns to `/login` or `/account`. `app` returns to the `tinysonic://oidc` scheme.'
                invite:
                  type: string
                  description: 'Required for `mode: invite`.'
                username:
                  type: string
                  description: 'Required for `mode: invite`.'
      responses:
        '200':
          description: Provider authorisation URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Invitation invalid (mode invite).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/oidc/callback:
    get:
      tags: [Single sign-on]
      summary: Provider redirect target
      description: |
        Called by the provider, not by clients. It consumes the state, verifies
        the ID token (issuer, audience, nonce), applies the flow's mode, and
        redirects:
        - web sign-in: to `<base_url>/login#oidc=<code>`
        - web link: to `<base_url>/account?linked=1`
        - app: to `tinysonic://oidc?code=<code>` (or `linked=1`)
        - failure: to the same page with `oidc_error=<message>`

        The code is valid for 60 seconds and is single-use.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Authorisation code from the provider.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user declines.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the client, as described above.
        '400':
          description: Unknown or already-used state. Plain text, not JSON.
          content:
            text/plain:
              schema:
                type: string
  /api/oidc/exchange:
    post:
      tags: [Single sign-on]
      summary: Trade the one-time code for a session or device key
      description: Web clients get a session token. The app gets its own API key, as with pairing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                device:
                  type: string
                  description: Name for the app's key. Used only for the app. Defaults to "app", maximum 64 characters.
      responses:
        '200':
          description: Session (web) or device key (app).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    required: [apiKey, username, server]
                    properties:
                      apiKey:
                        type: string
                      username:
                        type: string
                      server:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/oidc/identities:
    get:
      tags: [Single sign-on]
      summary: List the identities linked to the caller
      responses:
        '200':
          description: Linked identities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/oidc/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Single sign-on]
      summary: Unlink one of the caller's identities
      description: Refused when it would leave the account with no sign-in method.
      responses:
        '200':
          description: Identity unlinked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unlinked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/library/stats:
    get:
      tags: [Library]
      summary: Library statistics, BPM coverage and running jobs
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: {type: integer}
                  albums: {type: integer}
                  songs: {type: integer}
                  duration: {type: integer, description: Total playing time in seconds.}
                  bpm:
                    type: object
                    properties:
                      tag: {type: integer, description: Songs with a BPM from file tags.}
                      calc: {type: integer, description: Songs with a BPM from the built-in estimator or an analysis tool.}
                      missing: {type: integer}
                  lastScan: {type: string, format: date-time, nullable: true, description: When the last full scan finished.}
                  scan:
                    type: object
                    properties:
                      running: {type: boolean}
                      count: {type: integer, description: Files read by the running scan.}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
                  ffmpeg:
                    type: object
                    properties:
                      available: {type: boolean}
                      reason: {type: string, description: Why BPM calculation is unavailable.}
                  analysis:
                    type: object
                    properties:
                      auto: {type: boolean, description: 'Assigned features are analysed after every scan (the `[analysis]` table is present).'}
                      features:
                        type: object
                        additionalProperties: {type: string}
                        description: Feature → tool, for example `{"bpm": "folksentia", "loudness": "ffmpeg"}`.
                      tools:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            available: {type: boolean}
                            reason: {type: string, nullable: true}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/library/scan:
    post:
      tags: [Library]
      summary: Rescan the music folders
      responses:
        '202':
          description: Scan started.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/library/bpm:
    post:
      tags: [Library]
      summary: Calculate BPM from the audio
      description: >-
        Starts a background job with the tool assigned to `bpm` (by default the
        built-in estimator, which decodes 90 s from the middle of each track
        with ffmpeg). `missing` analyses songs without a BPM; `all` also
        recalculates. The built-in estimator never changes BPM from file tags;
        an external tool assigned to `bpm` replaces it. Refused while a scan or
        another job runs; 503 when the tool is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [missing, all]
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [started]}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/library/analysis:
    post:
      tags: [Library]
      summary: Recalculate the analysis of tracks
      description: >-
        Runs the assigned tools again for the selected tracks, whether or not
        their files changed. Give either `ids` or `all`. `features` limits the
        run to some features; each must have a tool assigned. Refused while a
        scan or another job runs; 503 when a needed tool is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: string}, description: Song ids.}
                all: {type: boolean}
                features:
                  type: array
                  items: {type: string, enum: [bpm, beats, key, loudness, silence, waveform, fingerprint]}
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [started]}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/analysis:
    get:
      tags: [Analysis]
      summary: Stored analysis of one track
      description: >-
        Any signed-in account. Only reads the database: analysis runs in
        background jobs. Every feature is `null` when unknown or not computed.
        Values come from file tags (the key) or from the assigned tool, whose
        result replaces the tag's.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
          description: Song id (`so-…`).
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '202':
          description: >-
            Automatic analysis is on and some assigned features have no result
            yet. The body has what is known; `pending` lists the rest. Retry
            after the `Retry-After` seconds.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/duplicates:
    get:
      tags: [Analysis]
      summary: Groups of songs that hold the same recording
      description: >-
        Any signed-in account. Songs are grouped when their audio
        fingerprints match: the bit error rate at the best alignment is at
        most 0.15, so re-encodes (FLAC and MP3) and copies on several albums
        match, other recordings of the same tune do not. The groups come from
        a background search at startup and after analysis jobs that changed
        values; songs removed since then are left out.
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        songIds: {type: array, items: {type: string}, minItems: 2}
                        similarity: {type: number, minimum: 0, maximum: 1, description: 1 − bit error rate of the least similar matched pair in the group.}
                  computedAt: {type: string, format: date-time}
                  fingerprints: {type: integer, description: Fingerprints compared.}
        '202':
          description: The first search is still running. Retry after the `Retry-After` seconds.
          headers:
            Retry-After:
              schema: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/library/jobs/cancel:
    post:
      tags: [Library]
      summary: Stop the running job after the current track
      responses:
        '200':
          description: Stopping.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
