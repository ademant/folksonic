openapi: 3.1.0
info:
  title: tinysonic JSON API
  version: 1.0.0
  summary: Accounts, API keys, device pairing, passkeys, single sign-on, signed stream links and track analysis.
  description: |
    JSON endpoints under `/api`, used by the web account page and the Android
    app. They are not part of the Subsonic API: the Subsonic endpoints under
    `/rest` are listed in `docs/opensubsonic-endpoints.md`.

    Errors carry an HTTP status code and a JSON body `{"error": "<code>",
    "message": "<text>"}`. The code is stable and clients branch on it, for
    example `key_revoked`, `session_required` or `stream_url_expired`; the
    message is for people. Subsonic endpoints answer with their own envelope.

    Some operations accept only a signed-in session (`bearerAuth`), not an API
    key: key, pairing, passkey and identity management, library jobs and stream
    links. An API key sent to them gets 403 `session_required`.

    `GET /api/stream-url` returns a link to one song that plays at
    `/rest/stream.view` for 2 hours without other credentials.

    Paths are relative to the server root. With `base_path` set, prefix every
    path with it, for example `/folksonic/api/keys`.

    `/login` and `/account` are HTML pages and are not described here.
servers:
  - url: /
    description: Server root (or the base_path prefix, when set)
security:
  - bearerAuth: []
  - apiKeyHeader: []
  - apiKeyQuery: []
tags:
  - name: Accounts
  - name: API keys
  - name: Device pairing
  - name: Passkeys
  - name: Single sign-on
  - name: Stream
    description: >-
      Signed, short-lived links to one song for our own apps. Advertised as the
      OpenSubsonic extension `tinysonicStreamUrl`. Subsonic clients keep
      `apiKeyAuthentication`.
  - name: Library
    description: Library administration for librarians. Other accounts get 403.
  - name: Analysis
    description: >-
      Per-track audio analysis computed in the background by the tools
      assigned in the `[analysis]` config table, or computed on another
      machine and stored with `tinysonic analysis import` (offline analysis;
      there is no network endpoint for it). Advertised as the
      OpenSubsonic extension `tinysonicAnalysis`; version 2 adds the
      fingerprint object and `/api/duplicates`, version 3 the onsets,
      rhythm and spectral objects.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Session token from `/api/login`, a passkey sign-in, a registration, or `/api/oidc/exchange` (web). Sent as `Authorization: Bearer <token>`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Device API key (`tsk_…`) in the `X-Api-Key` header. Preferred: the key stays out of URLs and access logs. A key with a scope (the removed analysis worker keys) is refused.'
    dpopProof:
      type: apiKey
      in: header
      name: DPoP
      description: 'A paired app (device) signs each request with its Keystore key and sends the proof (RFC 9449) in the `DPoP` header. No bearer secret is sent. The proof names the method and the request URL without its query, and carries a fresh `iat` and a unique `jti` (at most 128 characters). A header over 8 KB is refused.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: Device API key (`tsk_…`) as the `apiKey` parameter, for Subsonic clients. Also accepted as a form field.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Ceremony:
      name: ceremony
      in: query
      required: true
      description: Ceremony id returned by the matching `begin` call. Single-use, expires after 5 minutes.
      schema:
        type: string
  schemas:
    LibraryJob:
      type: object
      description: >-
        The running or last job: `bpm` from the BPM buttons, `analysis` for a
        recalculation (`recalc`) or the automatic analysis after scans
        (`pending`). Only `running` is set before the first job.
      properties:
        kind: {type: string, enum: [bpm, analysis]}
        mode: {type: string, enum: [missing, all, recalc, pending]}
        running: {type: boolean}
        total: {type: integer}
        done: {type: integer}
        updated: {type: integer, description: Songs with a changed value.}
        failed: {type: integer}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        error: {type: string, nullable: true, description: '"stopped" when cancelled.'}
        pending: {type: integer, description: Tracks not yet done while running.}
        current: {type: string, nullable: true, description: Song id being analysed while running.}
        songsPerMinute: {type: number, description: Rate while running.}
        lastError: {type: string, nullable: true, description: 'Last failure while running or after the run: `song tool: message`.'}
    Analysis:
      type: object
      properties:
        id: {type: string}
        fileVersion: {type: string, description: '`sha256:…` of the file the values belong to; changes when the file changes.'}
        waveform:
          type: object
          nullable: true
          properties:
            bins: {type: integer}
            peaks: {type: array, items: {type: integer, minimum: 0, maximum: 255}, description: Peak per bin, the loudest bin is 255.}
        beats:
          type: object
          nullable: true
          properties:
            timesMs: {type: array, items: {type: integer}}
            downbeatIndexes: {type: array, nullable: true, items: {type: integer}, description: Indexes into timesMs of beats that start a bar.}
        bpm:
          type: object
          nullable: true
          properties:
            value: {type: number}
            confidence: {type: number, nullable: true, minimum: 0, maximum: 1, description: '`null` for BPM from tags.'}
        key:
          type: object
          nullable: true
          properties:
            tonic: {type: string, examples: [A, F#, Bb]}
            mode: {type: string, enum: [major, minor]}
            confidence: {type: number, nullable: true, minimum: 0, maximum: 1}
        loudness:
          type: object
          nullable: true
          properties:
            integratedLufs: {type: number, nullable: true}
            truePeakDbtp: {type: number, nullable: true}
        silence:
          type: object
          nullable: true
          properties:
            leadMs: {type: integer, nullable: true}
            tailMs: {type: integer, nullable: true}
        fingerprint:
          type: object
          nullable: true
          description: Chromaprint fingerprint of the first 120 s. Only compare fingerprints with the same algorithm and version.
          properties:
            algorithm: {type: string, enum: [chromaprint]}
            version: {type: integer, description: 'Chromaprint algorithm version, 2 for the fpcalc/AcoustID default.'}
            durationSec: {type: number, description: Seconds of audio fingerprinted.}
            value: {type: string, description: 'Compressed fingerprint, base64 as fpcalc prints it.'}
        onsets:
          type: object
          nullable: true
          description: >-
            Note starts, for time-stretching players (extension version 3).
            Both arrays have the same length; empty when no onset passed
            folksentia's threshold.
          properties:
            timesMs: {type: array, items: {type: integer, minimum: 0}, description: Ascending.}
            strengths: {type: array, items: {type: integer, minimum: 0, maximum: 255}, description: Relative to the track's strongest onset (255).}
        rhythm:
          type: object
          nullable: true
          description: >-
            The music's own cycle as folksentia measures it (experimental,
            extension version 3). `null` for silence, tracks shorter than
            10 s, or when no cycle can be measured.
          properties:
            pulseSec: {type: number, nullable: true, description: Seconds per pulse.}
            barPulses: {type: integer, nullable: true, minimum: 1, description: Pulses per bar.}
            barsPerMin: {type: number, nullable: true, description: Bars per minute, what dancers count.}
            barScore: {type: number, nullable: true, minimum: 0, maximum: 1, description: How clearly the bar recurs.}
        spectral:
          type: object
          nullable: true
          description: How many frequencies the sound uses (extension version 3).
          properties:
            complexity: {type: number, nullable: true, description: 'Median spectral peaks per frame (2 for a two-partial tone, 59 for white noise; folk dance tracks read about 9 to 20).'}
            entropy: {type: number, nullable: true, description: 'Median spectral entropy in bits: low for a few tones, high for noise or percussion (at most 10).'}
        pending:
          type: array
          items: {type: string}
          description: Only in 202 responses.
    Error:
      type: object
      description: |
        Every JSON API error (#194), except the RFC 8628 device-flow errors of
        `/api/device/token` and `/api/device/refresh`. Branch on `error`, show
        `message`. Besides the refusal codes (README, "Refusal codes") and the
        specific codes below, an error has the generic code of its status:
        `bad_request` (400), `unauthorized` (401), `forbidden` (403),
        `not_found` (404), `method_not_allowed` (405), `conflict` (409), `too_large` (413),
        `unsupported_media_type` (415), `rate_limited` (429),
        `internal_error` (500), `unavailable` (503).
      required: [error, message]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: |
            Stable code. Specific codes: `database_error`, `invalid_json`,
            `librarian_required`, `registration_disabled`,
            `passkeys_unavailable`, `no_passkey`, `ceremony_expired`,
            `sso_not_configured`, `sso_unavailable`, `last_sign_in_method`,
            `job_running`, `no_job_running`, `import_running`,
            `tool_unavailable`, `password_invalid`, `username_taken`
            (409 from registration), `too_many_players` (409 from a remote
            player report), `method_not_allowed` (405, with `Allow`).
        message:
          type: string
          description: Text for people. Clients should not parse it.
    Session:
      type: object
      required: [token, username, role]
      properties:
        token:
          type: string
          description: Bearer session token, valid for 30 days.
        username:
          type: string
        role:
          type: string
          enum: [librarian, user]
    ApiKeyCreated:
      type: object
      required: [apiKey, label, expiresAt]
      properties:
        apiKey:
          type: string
          description: Shown once. It cannot be retrieved later.
        label:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
    ApiKeyInfo:
      type: object
      required: [id, label, prefix, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        prefix:
          type: string
          description: First characters of the key, for recognition.
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
        analysisImport:
          type: boolean
          description: The key may fetch analysis jobs and upload results (`/api/analysis/jobs`, `/api/analysis/results`). One key per account at most.
    PairingStart:
      type: object
      required: [token, uri, expiresIn]
      properties:
        token:
          type: string
        uri:
          type: string
          description: '`tinysonic://pair?server=<base_url>&token=<token>`. This is what the QR code encodes.'
        link:
          type: string
          description: '`<base_url>/pair#token=<token>`. The token is in the fragment, so a browser does not send it to the server.'
        expiresIn:
          type: integer
          description: Seconds until the token expires (900).
    Passkey:
      type: object
      required: [id, label, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
          description: Empty when the passkey was added without a name.
        createdAt:
          type: string
    Identity:
      type: object
      required: [id, issuer, subject, createdAt]
      properties:
        id:
          type: integer
        issuer:
          type: string
        subject:
          type: string
          description: The provider's stable user identifier.
        createdAt:
          type: string
    WebAuthnOptions:
      type: object
      required: [ceremony, options]
      properties:
        ceremony:
          type: string
        options:
          type: object
          description: WebAuthn `publicKey` creation or request options, passed to the browser unchanged.
    WebAuthnCredential:
      type: object
      description: The credential returned by `navigator.credentials.create()` or `.get()`, serialised as JSON. Passed to the library unchanged.
      additionalProperties: true
  responses:
    Forbidden:
      description: The caller is not a librarian.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid JSON body or invalid value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session or API key, or a sign-in that has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource that belongs to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request would break an account rule, such as removing the last sign-in method or a username that is taken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The feature is not configured on this server (passkeys need `base_url`; single sign-on needs the `oidc` block) or the identity provider cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /api/register:
    post:
      tags: [Accounts]
      summary: Create an account with a password
      description: |
        With `invite`, the account is active at once and the response is a
        session. Without `invite`, the account is pending and needs
        `allow_registration` on the server; an administrator approves it with
        `tinysonic user approve`. The password must be 8 to 1024 bytes.
        Registration attempts spend the same per-address budget as password
        sign-in, so probing names or invitation codes is slowed and then
        refused with 429 (#190).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                invite:
                  type: string
                  description: Invitation code. Optional.
      responses:
        '201':
          description: Account created and signed in (invitation given).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [active]
        '202':
          description: Account created and pending approval (no invitation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Registration is disabled, or the invitation is invalid, used, expired or bound to another username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: |
            Too many failed attempts from this address (`Retry-After` says when
            to try again). The attempt is not counted once the limit is reached;
            no account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/login:
    post:
      tags: [Accounts]
      summary: Sign in with username and password
      description: |
        A correct password gives its attempt back against the per-address limit.
        Each attempt spends budget before the password is hashed. At most two
        password checks run at once; while both are busy, the request is
        answered with `server_busy` and `Retry-After: 1`, and it is not counted
        as a failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Wrong username or password, or the account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Too many failed attempts from this address (`Retry-After` says when
            to try again), or `server_busy` when every password check is in use.
            No password was checked for `server_busy`.
  /api/logout:
    post:
      security: []
      tags: [Accounts]
      summary: End the session behind the Bearer token
      description: >-
        Needs no credentials: a Bearer session token, when sent, is ended, and
        the answer is the same without one.
      responses:
        '200':
          description: Session ended (or no token was sent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['signed out']
  /api/sessions:
    get:
      security:
        - bearerAuth: []
      tags: [Accounts]
      summary: List the caller's sessions
      description: >-
        Sessions only (an API key or device grant gets 403). A session lasts
        at most 30 days and ends after 7 days without use; ended ones are not
        listed. `current` marks the session the request came with.
      responses:
        '200':
          description: The live sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        label: {type: string, description: 'The client, from its User-Agent at sign-in.'}
                        createdAt: {type: string, format: date-time}
                        lastUsedAt: {type: string, format: date-time}
                        expiresAt: {type: string, format: date-time}
                        current: {type: boolean}
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - bearerAuth: []
      tags: [Accounts]
      summary: Sign out everywhere
      description: Ends every session of the caller, the current one too. API keys are not touched.
      responses:
        '200':
          description: All sessions ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['signed out everywhere']}
                  count: {type: integer}
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sessions/{id}:
    delete:
      security:
        - bearerAuth: []
      tags: [Accounts]
      summary: End one of the caller's sessions
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['signed out']}
        '404':
          description: The caller has no session with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/stream-url:
    get:
      security:
        - bearerAuth: []
      tags: [Stream]
      summary: Signed stream URL for one song
      description: >-
        A signed-in session or a device grant (DPoP access token); an API key
        gets 403 `session_required`. The returned URL
        plays the song at `/rest/stream.view` with no other credentials, until
        `expiresAt` (2 hours). The URL is bound to the song, the user and the
        expiry; changing any of them gets 403 `stream_url_invalid`.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
          description: Song id (`so-…`).
      responses:
        '200':
          description: The link and its expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  expiresAt: {type: string, format: date-time}
        '400':
          description: Missing `id`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A key was used, or the request needs a session.
        '404':
          description: No song with that id.
  /api/device/authorize:
    post:
      security: []
      tags: [Device grant]
      summary: Start a device grant (RFC 8628)
      description: >-
        Called by one of our apps. Returns a device code the app keeps and a
        user code the person types on the account page. The codes expire after
        ten minutes; poll `/api/device/token` at most once per `interval`
        seconds. Refused with 503 when too many grants wait for approval.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, description: Name shown on the account page (up to 64 characters.)}
      responses:
        '200':
          description: The codes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: {type: string}
                  user_code: {type: string, description: '`XXXX-XXXX`.'}
                  verification_uri: {type: string}
                  expires_in: {type: integer}
                  interval: {type: integer}
        '400':
          description: Invalid JSON body.
        '503':
          description: Too many grants wait for approval.
  /api/device/approve:
    post:
      security:
        - bearerAuth: []
      tags: [Device grant]
      summary: Approve a device's user code
      description: >-
        Session only. Gives the pending grant with this user code to the
        signed-in user. The dash and case of the code do not matter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code: {type: string}
      responses:
        '200':
          description: Approved.
        '400':
          description: Invalid JSON body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A key or a device was used; the request needs a session.
        '404':
          description: The code is unknown, used or expired.
  /api/device/token:
    post:
      security: []
      tags: [Device grant]
      summary: Exchange a device code for tokens (RFC 8628, DPoP)
      description: >-
        Form body with `grant_type=urn:ietf:params:oauth:grant-type:device_code`
        and `device_code`. Needs a `DPoP` proof signed by the device's key; the
        tokens are bound to that key. Errors use the RFC names:
        `authorization_pending`, `slow_down` (poll less often), `expired_token`,
        `invalid_grant`, `invalid_dpop_proof`. The access token lasts 15 minutes
        and is sent as `Authorization: DPoP <token>` with a fresh proof on every
        request, to `/rest/*` and `/api/*`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, device_code]
              properties:
                grant_type: {type: string}
                device_code: {type: string}
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [DPoP]}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
        '400':
          description: One of the RFC error codes above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
  /api/device/refresh:
    post:
      security: []
      tags: [Device grant]
      summary: Rotate a device's refresh token
      description: >-
        Form body with `grant_type=refresh_token` and `refresh_token`, with a
        DPoP proof from the grant's key. Both tokens are replaced. Using a
        refresh token a second time revokes the whole grant (`invalid_grant`),
        and so does an unused refresh token left for 30 days. Access tokens of a
        revoked grant stop at once.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, refresh_token]
              properties:
                grant_type: {type: string}
                refresh_token: {type: string}
      responses:
        '200':
          description: The new tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [DPoP]}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
        '400':
          description: One of the RFC error codes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
  /api/device/revoke:
    post:
      security:
        - bearerAuth: []
      tags: [Device grant]
      summary: End every device grant of the account
      description: >-
        Session only. Revokes all grants of the signed-in user: their access and
        refresh tokens stop working at once.
      responses:
        '200':
          description: How many grants were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A key or a device was used; the request needs a session.
  /api/remote/players:
    get:
      security:
        - bearerAuth: []
      tags: [Remote playback]
      summary: List the account's players
      description: >-
        Every player of the signed-in user with its last reported state. A
        player is online when it reported within the last 60 seconds.
      responses:
        '200':
          description: The players.
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        status: {type: string, enum: [playing, paused, stopped]}
                        songId: {type: string}
                        positionMs: {type: integer}
                        reportedAt: {type: string, format: date-time}
                        appliedSeq: {type: integer}
                        controller: {type: string, description: The controller the player obeyed last.}
                        online: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/remote/players/{id}/state:
    post:
      security:
        - bearerAuth: []
      tags: [Remote playback]
      summary: Report a player's state
      description: >-
        Called by a player on start and on every change. Creates the player on
        first report. `applied_seq` is the last command sequence the player has
        applied; it only moves forward, so an old report cannot make commands
        replay.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: The player's own id, 1 to 64 letters, digits, dots, dashes or underscores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                name: {type: string, description: Name shown to controllers (up to 64 characters.)}
                status: {type: string, enum: [playing, paused, stopped]}
                song_id: {type: string, maxLength: 64}
                position_ms: {type: integer}
                applied_seq: {type: integer}
                controller: {type: string, maxLength: 64}
      responses:
        '200':
          description: Stored.
        '400':
          description: Invalid id, status, position or sequence, or a song_id or controller over 64 bytes.
        '409':
          description: >-
            `too_many_players`: the account has 16 players on record and the
            one that reported longest ago did so within the last minute. A
            new player otherwise replaces that one, with its commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/remote/players/{id}/commands:
    get:
      security:
        - bearerAuth: []
      tags: [Remote playback]
      summary: Long poll for a player's commands
      description: >-
        Returns the commands after `after`, or after the player's applied
        sequence if that is higher, in order. Waits up to `wait` seconds (at most
        30) when there are none, and returns as soon as one arrives. Commands
        older than five minutes are never returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
          description: The last sequence number the player has seen.
        - name: wait
          in: query
          schema: {type: integer, minimum: 0, maximum: 30}
          description: Seconds to wait for a command.
      responses:
        '200':
          description: The commands, possibly none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: {type: integer}
                        command: {type: string, enum: [play, pause, seek, next, previous]}
                        positionMs: {type: integer}
                        songId: {type: string}
                        controller: {type: string}
                        sentAt: {type: string, format: date-time}
        '400':
          description: Invalid id, `after` or `wait`.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      security:
        - bearerAuth: []
      tags: [Remote playback]
      summary: Send a command to a player
      description: >-
        Any app of the signed-in user may send. Commands are obeyed in the order
        they were sent, so the last one wins. A player must have reported at
        least once (404 otherwise). At most 100 commands wait for a player (429).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {type: string, enum: [play, pause, seek, next, previous]}
                position_ms: {type: integer, description: Required for seek.}
                song_id: {type: string}
      responses:
        '200':
          description: Queued, with its sequence number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: {type: integer}
        '400':
          description: Unknown command or a bad seek position.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such player for this account.
        '429':
          description: Too many commands are waiting for this player.
  /api/relay/devices:
    get:
      security:
        - bearerAuth: []
      tags: [Relay]
      summary: List the account's device records
      description: >-
        The public records of the signed-in user's devices (#159). Another user
        never sees them. folksonic does not read the public key; devices trust
        each other by their own pairing check.
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [studio, phone]}
                        name: {type: string}
                        publicKey: {type: string}
                        updatedAt: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/relay/devices/{id}:
    put:
      security:
        - bearerAuth: []
      tags: [Relay]
      summary: Publish or update a device record
      description: >-
        A device publishes its own record: kind, display name and public key
        material (base64url, at most 1024 characters, never interpreted by the
        server). Names are cut to 64 characters.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: The device's id, 1 to 64 letters, digits, dots, dashes or underscores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, publicKey]
              properties:
                kind: {type: string, enum: [studio, phone]}
                name: {type: string}
                publicKey: {type: string}
      responses:
        '200':
          description: Stored.
        '400':
          description: Invalid id, kind or key.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      security:
        - bearerAuth: []
      tags: [Relay]
      summary: Remove a device record
      description: >-
        Removes one of the account's records. The device's relay connection, if it
        has one, is closed.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such device on this account.
  /api/relay/connect:
    get:
      security:
        - bearerAuth: []
      tags: [Relay]
      summary: Open a device's relay (WebSocket)
      description: >-
        Upgrades to a WebSocket (RFC 6455) for one of the account's devices. The
        device must have a record (404 otherwise). Credentials are headers, never
        the URL. Messages are binary frames `[1-byte recipient length][recipient id][payload]`;
        the recipient gets `[1-byte sender length][sender id][payload]`. The
        payload is end-to-end encrypted by the devices and is not stored or
        logged. A frame to a device that is not connected gets a text note
        `{"type":"undelivered","to":…}`. Limits: 16 KiB per message, 30 messages
        per second (burst 60), 8 devices connected per account, a ping every 30
        seconds and a drop after 60 seconds of silence. Text messages and
        fragmented messages are refused (close codes 1003 and 1002).
      parameters:
        - name: device
          in: query
          required: true
          schema: {type: string}
          description: The device's id; it must have a record on the account.
      responses:
        '101':
          description: Switching Protocols; the relay is open.
        '400':
          description: Not a WebSocket upgrade, or an invalid device id.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No record for this device on the account.
  /api/device/me:
    get:
      tags: [Device pairing]
      summary: The paired device this proof belongs to
      description: Proof only. Refused with `pairing_pending` until the pairing is confirmed on both sides (account page and phone).
      security:
        - dpopProof: []
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
                  lastUsedAt: {type: string}
        '401':
          description: Refused with `pairing_pending`, `pairing_rejected`, `pairing_expired`, `device_unknown`, `proof_invalid` or `proof_replayed`.
  /api/pair/pending:
    get:
      tags: [Device pairing]
      summary: Pairings waiting for confirmation
      description: Session only. Each entry has the verification code the phone shows too.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The pending pairings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        createdAt: {type: string}
                        expiresAt: {type: string}
                        code:
                          type: string
                          description: Six-digit verification code; empty for a pairing from before verification codes.
                        clientAddress: {type: string}
                        ownerConfirmed: {type: boolean}
                        deviceConfirmed: {type: boolean}
  /api/pair/pending/{id}/confirm:
    post:
      tags: [Device pairing]
      summary: The owner's answer to a pairing's verification code
      description: >-
        Session only. `match` when the code on the account page equals the one
        on the phone, `reject` otherwise. The device is created once the phone
        has confirmed too (`POST /api/pair/confirm`). A rejection also retires
        the QR code; other pairings already waiting on it stay open.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: string, enum: [match, reject]}
      responses:
        '201':
          description: Both sides confirmed; the device.
        '202':
          description: Confirmed here; waiting for the phone (`waitingFor`).
        '200':
          description: Rejected.
        '404':
          description: No such pairing.
        '409':
          description: '`pairing_rejected`: the pairing was rejected already.'
        '410':
          description: '`pairing_expired`: the pairing ran out before confirmation.'
  /api/pair/confirm:
    post:
      tags: [Device pairing]
      summary: The device's answer to its verification code
      description: >-
        Signed with the key being paired (a DPoP proof for this URL), although
        it is not a device yet. `match` when the code on the phone equals the
        one on the account page, `cancel` otherwise; cancelling leaves the QR
        code usable. The code is SHA-256(token_hash ":" jkt), first four bytes
        big-endian, modulo 1,000,000, six digits, where token_hash is the hex
        SHA-256 of the QR token and jkt the RFC 7638 thumbprint of the key.
      security:
        - dpopProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: string, enum: [match, cancel]}
      responses:
        '200':
          description: Paired (`status` = `paired`, with `device`), or cancelled.
        '202':
          description: Confirmed on the phone; waiting for the account page (`waitingFor` = `owner`).
        '401':
          description: Missing or invalid proof (`proof_invalid`, `proof_replayed`).
        '404':
          description: '`device_unknown`: no pairing waits for this key.'
        '409':
          description: '`pairing_rejected`: rejected on the account page, cancelled, or another device used the QR code.'
        '410':
          description: '`pairing_expired`.'
  /api/devices:
    get:
      tags: [Device pairing]
      summary: The account's paired devices
      description: Session only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        createdAt: {type: string}
                        lastUsedAt: {type: string}
  /api/devices/{id}:
    delete:
      tags: [Device pairing]
      summary: Remove a paired device
      description: Session only. The device's next request is refused with `device_unknown`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Removed.
        '404':
          description: No such device.
  /api/keys:
    get:
      security:
        - bearerAuth: []
      tags: [API keys]
      summary: List the caller's API keys
      responses:
        '200':
          description: Keys, without their secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyInfo'
                  canGrantAnalysisImport:
                    type: boolean
                    description: The caller is a librarian and may grant analysis import to a key.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      security:
        - bearerAuth: []
      tags: [API keys]
      summary: Create an API key
      description: The key is returned once. The Android app and other clients use it as the `apiKey` parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Name for the key. Defaults to "api key".
                expires_days:
                  type: integer
                  minimum: 0
                  description: >-
                    Lifetime in days, at most `api_key_ttl_days` (400 above it).
                    Zero (default) means `api_key_ttl_days`; every key expires.
      responses:
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      security:
        - bearerAuth: []
      tags: [API keys]
      summary: Revoke one of the caller's keys
      responses:
        '200':
          description: Key revoked. The key stops working at once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [revoked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/keys/{id}/analysis-import:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      security:
        - bearerAuth: []
      tags: [API keys]
      summary: Allow one key to fetch analysis jobs and upload results
      description: >-
        Librarians only, with a session (#163). The key may then use
        `GET /api/analysis/jobs` and `POST /api/analysis/results`, in the
        `X-Api-Key` header only, and nothing else of the library
        administration. One key per account holds the grant: any other key
        of the account loses it. Revoked and expired keys cannot get it. The
        change is logged.
      responses:
        '200':
          description: Granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  analysisImport: {type: boolean, enum: [true]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      security:
        - bearerAuth: []
      tags: [API keys]
      summary: Take the analysis import grant away from a key
      description: Librarians only, with a session. A key without the grant is not an error. The change is logged.
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  analysisImport: {type: boolean, enum: [false]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pair/start:
    post:
      security:
        - bearerAuth: []
      tags: [Device pairing]
      summary: Create a pairing token, its QR payload and its link
      description: The token is single-use and expires after 15 minutes. The app redeems it at `/api/pair/complete`. `link` is the same token as an HTTPS link for a desktop app (see `GET /pair`).
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pair/complete:
    post:
      tags: [Device pairing]
      summary: Redeem a pairing token
      description: >-
        No authentication. The single-use token is the credential. With `jwk`
        (the app's public key, #101) the pairing waits for confirmation on both
        sides (#103) and no secret is returned: show the verification code,
        send the phone's answer to `POST /api/pair/confirm`, and poll
        `GET /api/device/me` with a signed proof until it succeeds. A QR code
        may be scanned by up to three devices until one is confirmed. Without `jwk`, the legacy form returns an
        API key for apps that predate device keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                device:
                  type: string
                  description: Name for the device or key.
                jwk:
                  type: object
                  description: The app's public P-256 key (`kty`, `crv`, `x`, `y`). Starts a device pairing.
                  required: [kty, crv, x, y]
                  properties:
                    kty: {type: string, enum: [EC]}
                    crv: {type: string, enum: [P-256]}
                    x: {type: string}
                    y: {type: string}
      responses:
        '202':
          description: Pairing pending; confirm the verification code on both sides (`confirm` is true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [pending]}
                  pendingId: {type: integer}
                  expiresAt: {type: string, format: date-time}
                  confirm: {type: boolean}
        '409':
          description: The key is already paired, or `pairing_token_used` (the QR code was used up or retired).
        '429':
          description: '`pairing_busy`: three devices already wait on this QR code.'
        '200':
          description: Key issued.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, username, server]
                properties:
                  apiKey:
                    type: string
                  username:
                    type: string
                  server:
                    type: string
                    description: The address the app should use, from `base_url` or the request host.
        '401':
          description: Token unknown, used or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pair/qr:
    post:
      security:
        - bearerAuth: []
      tags: [Device pairing]
      summary: Create a pairing token and return its QR code
      description: |
        Creates the same token as `/api/pair/start` and returns it as a QR
        code. SVG is the default. PNG is returned when the request has
        `Accept: image/png` (and not `image/svg+xml`) or `?format=png`.
        The same token is also returned as the link `<base_url>/pair#token=…`
        in the `X-Pairing-Link` response header. Responses are not cached.
      responses:
        '200':
          description: QR code image.
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkeys:
    get:
      security:
        - bearerAuth: []
      tags: [Passkeys]
      summary: List the caller's passkeys
      responses:
        '200':
          description: Passkeys, without key material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkeys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      security:
        - bearerAuth: []
      tags: [Passkeys]
      summary: Remove one of the caller's passkeys
      description: Refused when it would leave the account with no sign-in method (no password, no other passkey and no linked identity).
      responses:
        '200':
          description: Passkey removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [removed]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/passkey/register/begin:
    post:
      security:
        - bearerAuth: []
      tags: [Passkeys]
      summary: Start adding a passkey to the signed-in account
      responses:
        '200':
          description: WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/passkey/register/finish:
    post:
      security:
        - bearerAuth: []
      tags: [Passkeys]
      summary: Store the passkey created in the browser
      parameters:
        - $ref: '#/components/parameters/Ceremony'
        - name: label
          in: query
          required: false
          description: Name for the passkey. Up to 64 characters.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '201':
          description: Passkey stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ['passkey added']
        '400':
          description: Ceremony expired, belongs to another account, or the passkey was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/passkey/login/begin:
    post:
      tags: [Passkeys]
      summary: Start a passkey sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '200':
          description: WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '401':
          description: No active account with a passkey under that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/passkey/login/finish:
    post:
      tags: [Passkeys]
      summary: Verify the signed challenge and issue a session
      security: []
      parameters:
        - $ref: '#/components/parameters/Ceremony'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/register/passkey/begin:
    post:
      tags: [Passkeys]
      summary: Start sign-up with an invitation and a passkey, without a password
      description: Checks the invitation and username, then returns options. Nothing is written until the passkey is verified, so an abandoned attempt uses no invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, invite]
              properties:
                username:
                  type: string
                invite:
                  type: string
      responses:
        '200':
          description: WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The invitation is invalid, used, expired or bound to another username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/register/passkey/finish:
    post:
      tags: [Passkeys]
      summary: Verify the passkey, create the account and sign in
      security: []
      parameters:
        - $ref: '#/components/parameters/Ceremony'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
      responses:
        '201':
          description: Account created and signed in. The invitation is spent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [active]
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The invitation was used or became invalid while the passkey was being created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/oidc/status:
    get:
      tags: [Single sign-on]
      summary: Whether single sign-on is configured
      security: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
  /api/oidc/begin:
    post:
      tags: [Single sign-on]
      summary: Start a single sign-on
      description: |
        `mode` selects what the callback does:
        - `signin` (default): sign in an account already linked to the identity.
        - `link`: attach the identity to the signed-in account. Needs a session or API key.
        - `invite`: create an account bound to `username`, spending `invite`.

        The browser (or app) then opens the returned `url`. PKCE and a nonce are
        used, and the state is single-use and expires after 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [signin, link, invite]
                  default: signin
                client:
                  type: string
                  enum: [web, app]
                  default: web
                  description: '`web` returns to `/login` or `/account`. `app` returns to the `tinysonic://oidc` scheme.'
                invite:
                  type: string
                  description: 'Required for `mode: invite`.'
                username:
                  type: string
                  description: 'Required for `mode: invite`.'
      responses:
        '200':
          description: Provider authorisation URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Invitation invalid (mode invite).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/oidc/callback:
    get:
      tags: [Single sign-on]
      summary: Provider redirect target
      description: |
        Called by the provider, not by clients. It consumes the state, verifies
        the ID token (issuer, audience, nonce), applies the flow's mode, and
        redirects:
        - web sign-in: to `<base_url>/login#oidc=<code>`
        - web link: to `<base_url>/account?linked=1`
        - app: to `tinysonic://oidc?code=<code>` (or `linked=1`)
        - failure: to the same page with `oidc_error=<message>`

        The code is valid for 60 seconds and is single-use.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Authorisation code from the provider.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user declines.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the client, as described above.
        '400':
          description: Unknown or already-used state. Plain text, not JSON.
          content:
            text/plain:
              schema:
                type: string
  /api/oidc/exchange:
    post:
      tags: [Single sign-on]
      summary: Trade the one-time code for a session or device key
      description: Web clients get a session token. The app gets its own API key, as with pairing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                device:
                  type: string
                  description: Name for the app's key. Used only for the app. Defaults to "app", maximum 64 characters.
      responses:
        '200':
          description: Session (web) or device key (app).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - type: object
                    required: [apiKey, username, server]
                    properties:
                      apiKey:
                        type: string
                      username:
                        type: string
                      server:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/oidc/identities:
    get:
      security:
        - bearerAuth: []
      tags: [Single sign-on]
      summary: List the identities linked to the caller
      responses:
        '200':
          description: Linked identities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/oidc/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      security:
        - bearerAuth: []
      tags: [Single sign-on]
      summary: Unlink one of the caller's identities
      description: Refused when it would leave the account with no sign-in method.
      responses:
        '200':
          description: Identity unlinked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unlinked]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/library/stats:
    get:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Library statistics, BPM coverage and running jobs
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: {type: integer}
                  albums: {type: integer}
                  songs: {type: integer}
                  duration: {type: integer, description: Total playing time in seconds.}
                  bpm:
                    type: object
                    properties:
                      tag: {type: integer, description: Songs with a BPM from file tags.}
                      calc: {type: integer, description: Songs with a BPM from the built-in estimator or an analysis tool.}
                      missing: {type: integer}
                  lastScan: {type: string, format: date-time, nullable: true, description: When the last full scan finished.}
                  scan:
                    type: object
                    properties:
                      running: {type: boolean}
                      count: {type: integer, description: Files read by the running scan.}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
                  ffmpeg:
                    type: object
                    properties:
                      available: {type: boolean}
                      reason: {type: string, description: Why BPM calculation is unavailable.}
                  analysis:
                    type: object
                    properties:
                      auto: {type: boolean, description: 'Assigned features are analysed after every scan (the `[analysis]` table is present).'}
                      features:
                        type: object
                        additionalProperties: {type: string}
                        description: 'Feature → tool, for example `{"bpm": "folksentia", "loudness": "ffmpeg"}`.'
                      tools:
                        type: object
                        description: 'Tool → whether this server can run it. A folksentia without `command` is offline only: `available` false, reason `offline only: run it with ...`; its values come from `tinysonic analysis import`.'
                        additionalProperties:
                          type: object
                          properties:
                            available: {type: boolean}
                            reason: {type: string, nullable: true, description: 'Why the tool cannot run here, for example a missing binary or `offline only`.'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/library/scan:
    post:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Rescan the music folders
      responses:
        '202':
          description: Scan started.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/library/bpm:
    post:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Calculate BPM from the audio
      description: >-
        Starts a background job with the tool assigned to `bpm` (by default the
        built-in estimator, which decodes 90 s from the middle of each track
        with ffmpeg). `missing` analyses songs without a BPM; `all` also
        recalculates. The built-in estimator never changes BPM from file tags;
        an external tool assigned to `bpm` replaces it. Refused while a scan or
        another job runs; 503 when the tool is not available, including a
        folksentia that is offline only (no `command`; its values come from
        `tinysonic analysis import`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [missing, all]
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [started]}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/library/analysis:
    post:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Recalculate the analysis of tracks
      description: >-
        Runs the assigned tools again for the selected tracks, whether or not
        their files changed. Give either `ids` or `all`. `features` limits the
        run to some features; each must have a tool assigned. Refused while a
        scan or another job runs; 503 when a needed tool is not available.
        Features of an offline-only folksentia (no `command`) are skipped by a
        run without `features` and refused with 503 when listed in
        `features`; recalculate them with `tinysonic analysis export` and
        `import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: string}, description: Song ids.}
                all: {type: boolean}
                features:
                  type: array
                  items: {type: string, enum: [bpm, beats, key, loudness, silence, waveform, fingerprint, onsets, rhythm, spectral]}
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [started]}
                  job:
                    $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/library/analysis/failed:
    get:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Tracks whose last analysis failed
      description: >-
        Newest first, one entry per track and tool. `total` counts the tracks.
        Server paths in messages are replaced by `<music>`. Retry them with
        `POST /api/library/analysis`.
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        '200':
          description: Failed tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, description: Tracks with a failed analysis.}
                  songs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        title: {type: string}
                        artist: {type: string}
                        tool: {type: string}
                        error: {type: string}
                        analysedAt: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/analysis:
    get:
      tags: [Analysis]
      summary: Stored analysis of one track
      description: >-
        Any signed-in account. Only reads the database: analysis runs in
        background jobs. Every feature is `null` when unknown or not computed.
        Values come from file tags (the key) or from the assigned tool, whose
        result replaces the tag's, whether the tool ran on this server or its
        result was imported from an offline run. Features of an offline-only
        tool are never reported as `pending`: the server does not compute
        them, so a 202 would never resolve; they stay `null` until imported.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
          description: Song id (`so-…`).
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '202':
          description: >-
            Automatic analysis is on and some assigned features have no result
            yet. The body has what is known; `pending` lists the rest. Retry
            after the `Retry-After` seconds.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analysis/jobs:
    get:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      tags: [Analysis]
      summary: Job list for an offline folksentia run
      description: >-
        The document `tinysonic analysis export` writes (#163). A librarian's
        session, or the API key a librarian allowed to import analysis
        results, in `X-Api-Key` (a key in the URL is refused). The account
        must be a librarian on every call. Give exactly one of `all=1`,
        `pending=1` or `id`.
      parameters:
        - name: all
          in: query
          schema: {type: string, enum: ['1']}
          description: Every song.
        - name: pending
          in: query
          schema: {type: string, enum: ['1']}
          description: Only songs with features folksentia has not analysed yet.
        - name: id
          in: query
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
          description: Song ids (`so-…`), repeated.
        - name: features
          in: query
          schema: {type: string}
          description: Comma-separated features, each assigned to folksentia. Default every feature assigned to it.
      responses:
        '200':
          description: >-
            The job list (`format` `tinysonic-analysis-jobs`, `version` 1),
            the same as the CLI's `jobs.json`; see the README.
          content:
            application/json:
              schema:
                type: object
                required: [format, version, jobs]
                properties:
                  format: {type: string, enum: [tinysonic-analysis-jobs]}
                  version: {type: integer}
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        path: {type: string, description: 'Relative to the music folder, `/`-separated.'}
                        size: {type: integer}
                        mtimeMs: {type: integer}
                        durationMs: {type: integer}
                        features:
                          type: array
                          items: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`analysis_import_required` (a key without the grant, a key in the URL, or a device), or the account is not a librarian.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: folksentia is not assigned to any analysis feature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/analysis/results:
    post:
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      tags: [Analysis]
      summary: Import folksentia's result lines
      description: >-
        Runs the same import as `tinysonic analysis import` (#163): each line
        is checked against the song's file on the server (it must still
        exist with the exported size and modification time), only features
        assigned to folksentia are stored, impossible values are recorded as
        failed runs. Same credentials as `/api/analysis/jobs`. One import at
        a time. The body is capped by `analysis_upload_max_mb` (default 64
        MiB, after decompression) and 50,000 lines: upload a library in
        batches; each call stands on its own, and repeating one changes
        nothing.
      parameters:
        - name: dryRun
          in: query
          schema: {type: string, enum: ['1']}
          description: Check every line and report what would change; store nothing.
        - name: sizeOnly
          in: query
          schema: {type: string, enum: ['1']}
          description: Accept a result when the file size matches, whatever the modification time.
        - name: Content-Encoding
          in: header
          schema: {type: string, enum: [gzip]}
          description: Optional gzip compression of the body.
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: 'folksentia batch output: one JSON object per line, `{"job": …, "toolVersion": …, "result": …}` or `{"job": …, "skipped": "missing"|"changed"}`. `application/jsonl` and `text/plain` are accepted too.'
      responses:
        '200':
          description: The import report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun: {type: boolean}
                  lines: {type: integer, description: Non-empty lines read.}
                  applied: {type: integer, description: Results stored (or that would be).}
                  changed: {type: integer, description: Of those, results that changed a value.}
                  unchanged: {type: integer}
                  failed: {type: integer, description: Of those, failed runs (a tool error or an impossible value).}
                  rejected: {type: integer, description: Lines that are not result lines.}
                  skipped:
                    type: object
                    additionalProperties: {type: integer}
                    description: 'Skipped lines by reason: `missing`, `changed` (reported by folksentia), `stale` (the file changed or is gone since the export), `unreadable`, `unknown` (no such song), `unassigned`, `duplicate` (a later line has the same song).'
                  changedBy:
                    type: object
                    additionalProperties: {type: integer}
                    description: Per feature, the results that changed its value.
                  entries:
                    type: array
                    description: Every skipped, rejected and failed line, in order. Lines stored unchanged are only counted.
                    items:
                      type: object
                      required: [line, status, reason]
                      properties:
                        line: {type: integer}
                        songId: {type: string}
                        status: {type: string, enum: [skipped, rejected, failed]}
                        reason:
                          type: string
                          description: 'A skipped reason (see `skipped`), a rejection (`not_json`, `no_job`, `bad_skipped`, `no_result`, `schema`), or `tool_error` for a failed run.'
                        message: {type: string}
                  changedSongs:
                    type: array
                    items:
                      type: object
                      properties:
                        songId: {type: string}
                        features:
                          type: array
                          items: {type: string}
        '400':
          description: The body is not valid gzip or cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`analysis_import_required` (a key without the grant, a key in the URL, or a device), or the account is not a librarian.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another import is running, or folksentia is not assigned to any analysis feature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body is larger than `analysis_upload_max_mb` or has more than 50,000 lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not `application/x-ndjson`, or a `Content-Encoding` other than gzip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: A database error, or the server cannot read the music folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/duplicates:
    get:
      tags: [Analysis]
      summary: Groups of songs that hold the same recording
      description: >-
        Any signed-in account. Songs are grouped when their audio
        fingerprints match: the bit error rate at the best alignment is at
        most 0.15, so re-encodes (FLAC and MP3) and copies on several albums
        match, other recordings of the same tune do not. The groups come from
        a background search, started by the first request after a server
        start (answered 202 with Retry-After until it is done) and again
        after analysis jobs that changed values; songs removed since then
        are left out.
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        songIds: {type: array, items: {type: string}, minItems: 2}
                        similarity: {type: number, minimum: 0, maximum: 1, description: 1 − bit error rate of the least similar matched pair in the group.}
                  computedAt: {type: string, format: date-time}
                  fingerprints: {type: integer, description: Fingerprints compared.}
        '202':
          description: The first search is still running. Retry after the `Retry-After` seconds.
          headers:
            Retry-After:
              schema: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/library/jobs/cancel:
    post:
      security:
        - bearerAuth: []
      tags: [Library]
      summary: Stop the running job after the current track
      responses:
        '200':
          description: Stopping.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
