# tinysonic example configuration.
#
# Unknown keys are an error, so check spelling. Relative paths are resolved
# from the directory containing this file. Keep this file readable only by the
# user that runs tinysonic (chmod 600): it can hold a password.

# Required: one or more library roots. Each is walked recursively, so files in
# subdirectories are found. Relative entries resolve from this file's directory.
# A directory that is missing at startup is reported as a warning; the others
# keep working. (The older single-directory key `music_dir = "…"` still works.)
music_dirs = ["/path/to/your/music"]

# Optional bootstrap librarian account. Used only when the database has no users yet.
# After that, manage accounts with `tinysonic user …`, and remove these lines.
# username = "admin"
# password = "changeme"

# Public address clients reach the server at. Needed for QR-code pairing and
# passkeys. Use HTTPS when clients reach it over the internet.
# base_url = "https://music.example.com"

# Serve under a URL prefix instead of the root, for example to share a domain
# with other sites: https://example.com/folksonic. Set base_url to the full
# public address (including the prefix) and base_path to the prefix.
# base_path = "/folksonic"

# Let anyone register. New accounts stay pending until an active user approves
# them. Off by default.
allow_registration = false

# File tags to expose on songs, read from each file (FLAC, Ogg/Opus, MP3, M4A).
# Only the names listed here are read. They are returned on each song as
# "tinysonicTags" and advertised as the tinysonicSongTags extension. Changing
# the list makes the next scan re-read every file.
# song_tags = ["DANCE", "USE"]

# ffmpeg is used only to calculate missing BPM values on the library page.
# Default: "ffmpeg" on PATH. Without it, everything else works.
# ffmpeg_path = "/usr/bin/ffmpeg"

# Lowest log level written: debug, info, warn or error. --log-level overrides it.
# log_level = "info"

# Leading words skipped when grouping and sorting artists (getArtists,
# getIndexes). L' matches without a following space. "" disables it.
# ignored_articles = "The El La Las Le Les Los Il L' An A Die Das Ein"

# Optional, defaults shown
port = 4533
host = "0.0.0.0"
database_path = "smolsonic.db"
covers_dir = "covers"

# Single sign-on through an OpenID Connect provider (optional). Needs base_url.
# Register <base_url>/api/oidc/callback as the redirect URI with the provider.
# [oidc]
# issuer        = "https://auth.example.com/realms/main"
# client_id     = "tinysonic"
# client_secret = ""   # optional for public clients
