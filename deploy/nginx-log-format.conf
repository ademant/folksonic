# Access log format for tinysonic under /folksonic without query strings (#179).
#
# nginx's default "combined" format writes the whole request line ($request),
# query string included, so Subsonic passwords (p=, enc:…), tokens and API
# keys (apiKey=) and signed stream links (sig=) would end up in the access
# log. This format logs the path ($uri) only, plus the Range header (stream
# measurements need it). tinysonic logs track ids itself (id=…).
#
# log_format is allowed only in the http context, not inside a server block,
# so this file goes where nginx includes http-level snippets:
#   install -m 0644 deploy/nginx-log-format.conf /etc/nginx/conf.d/folksonic-log.conf
# deploy/nginx-subpath.conf then logs its locations with it, to their own
# file, and the site's main access log no longer sees those requests.
log_format folksonic_nokey '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_user_agent" range=$http_range';
