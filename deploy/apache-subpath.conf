# Apache (mod_proxy, mod_proxy_http, mod_deflate) for tinysonic under
# /folksonic on an existing HTTPS virtual host, as on cloud.ademant.de.
#
# Paste into the site's <VirtualHost *:443> block, then:
#   a2enmod proxy proxy_http deflate headers
#   apache2ctl configtest && systemctl reload apache2
#
# Matches base_path = "/folksonic" and port = 4534 in deploy/folksonic.toml.
# The prefix is passed through unchanged; tinysonic strips it itself.

# Access log without query strings (#84). API keys travel in apiKey= and the
# Subsonic p= parameters, and the default combined format writes the whole
# request line, so the keys end up in the log. This format logs the path only,
# plus the Range header (stream measurements need it). Track ids are logged by
# tinysonic itself (id=…), with the other request fields.
#
# The host's main vhost CustomLog must skip these requests, or they are still
# logged in full. Add env=!folksonic_request to that CustomLog line, then
# configtest and reload. The line below writes the path-only log instead.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\" range=%{Range}i" folksonic_nokey
SetEnvIf Request_URI "^/folksonic" folksonic_request
CustomLog ${APACHE_LOG_DIR}/folksonic-access.log folksonic_nokey env=folksonic_request

# Server version (#90): on the host, set ServerTokens Prod and ServerSignature
# Off (conf-enabled/security.conf), so responses do not announce the exact
# Apache version.

# HSTS for the whole site (browsers keep to HTTPS for a year), and the scheme
# tinysonic checks before it accepts tokens and signed stream URLs (#93). Put
# this snippet only in the HTTPS vhost: the header says the request was HTTPS.
Header always set Strict-Transport-Security "max-age=31536000"
RequestHeader set X-Forwarded-Proto "https"

# flushpackets=on sends audio to the client as it arrives instead of buffering.
ProxyPass        /folksonic http://127.0.0.1:4534/folksonic flushpackets=on
ProxyPassReverse /folksonic http://127.0.0.1:4534/folksonic

<Location /folksonic>
    # Compress JSON and text (a full song list shrinks about 4x). Audio and
    # images are already compressed and are not listed.
    #
    # An AddOutputFilterByType list inside a <Location> REPLACES the global
    # one from mods-enabled/deflate.conf for this path, so the text types
    # must be listed here as well, not only application/json.
    AddOutputFilterByType DEFLATE application/json text/html text/plain text/css text/javascript application/javascript application/xml text/xml
</Location>
