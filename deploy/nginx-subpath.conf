# nginx locations for tinysonic under /folksonic on an existing site.
#
# Include this inside the site's existing `server { listen 443 ssl; … }` block,
# next to the locations of the other services on that host:
#   install -m 0644 deploy/nginx-subpath.conf /etc/nginx/snippets/folksonic.conf
#   # in the server block:  include snippets/folksonic.conf;
#   nginx -t && systemctl reload nginx
#
# Matches base_path = "/folksonic" and port = 4534 in deploy/folksonic.toml.
# The prefix is passed through unchanged; tinysonic strips it itself.
#
# HSTS is set here, in each location: an add_header inside a location replaces
# the server-level add_header directives for that location. If the site sets
# other add_header lines at server level, repeat them in these locations too.

# /folksonic without the trailing slash: tinysonic redirects it to /folksonic/.
location = /folksonic {
    proxy_pass http://127.0.0.1:4534;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location /folksonic/ {
    proxy_pass http://127.0.0.1:4534;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress JSON and text responses (a full song list shrinks about 4x).
    # Audio and images are already compressed and are left alone.
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;

    # tinysonic caps request bodies at 1 MiB; reject larger ones here first.
    client_max_body_size 1m;

    # Audio streams are long-lived responses. Do not buffer them to disk,
    # and allow long pauses between chunks.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
