# nginx locations for tinysonic under /folksonic on an existing site.
#
# Include this inside the site's existing `server { listen 443 ssl; … }` block,
# next to the locations of the other services on that host:
#   install -m 0644 deploy/nginx-subpath.conf /etc/nginx/snippets/folksonic.conf
#   # in the server block:  include snippets/folksonic.conf;
#   nginx -t && systemctl reload nginx
#
# Matches base_path = "/folksonic" and port = 4534 in deploy/folksonic.toml.
# The prefix is passed through unchanged; tinysonic strips it itself.
#
# Access log without query strings (#179): every location below logs with
# the folksonic_nokey format from deploy/nginx-log-format.conf, which must be
# installed in /etc/nginx/conf.d/ first (nginx -t fails otherwise). An
# access_log inside a location replaces the server's, so these requests,
# with their apiKey= and p= parameters, never reach the site's main log.
# nginx's error log still writes the full request line of a failed request
# (an upstream timeout, for example); keep it readable by root only, and
# prefer the X-Api-Key header over apiKey= in clients that allow it.
#
# HSTS is set here, in each location: an add_header inside a location replaces
# the server-level add_header directives for that location. If the site sets
# other add_header lines at server level, repeat them in these locations too.

# /folksonic without the trailing slash: tinysonic redirects it to /folksonic/.
location = /folksonic {
    access_log /var/log/nginx/folksonic-access.log folksonic_nokey;
    proxy_pass http://127.0.0.1:4534;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security; # tinysonic sends one too (#180)
}

# The device relay is a WebSocket (#159, #161). Its Upgrade and Connection
# headers must reach tinysonic, so this exact location forwards them. An exact
# match wins over the prefix location below. Keep it a separate location.
location = /folksonic/api/relay/connect {
    access_log /var/log/nginx/folksonic-access.log folksonic_nokey;
    proxy_pass http://127.0.0.1:4534;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security; # tinysonic sends one too (#180)
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location /folksonic/ {
    access_log /var/log/nginx/folksonic-access.log folksonic_nokey;
    proxy_pass http://127.0.0.1:4534;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security; # tinysonic sends one too (#180)

    # Compress JSON and text responses (a full song list shrinks about 4x).
    # Audio and images are already compressed and are left alone.
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_vary on;

    # tinysonic caps request bodies at 1 MiB; reject larger ones here first.
    client_max_body_size 1m;

    # Audio streams are long-lived responses. Do not buffer them to disk,
    # and allow long pauses between chunks.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
