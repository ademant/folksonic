# nginx reverse proxy for tinysonic, with TLS.
#
# Replace music.example.com with the domain in base_url. Obtain certificates
# first, for example: certbot certonly --nginx -d music.example.com
# Then: install -m 0644 deploy/nginx.conf /etc/nginx/sites-available/tinysonic
#       ln -s /etc/nginx/sites-available/tinysonic /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

upstream tinysonic {
    server 127.0.0.1:4534;   # host/port from tinysonic.toml; keep it bound to loopback
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Subsonic clients send small form posts (playlist edits). tinysonic caps
    # request bodies at 1 MiB; match it here so nginx rejects larger ones first.
    client_max_body_size 1m;

    # To add tinysonic under /folksonic to an existing site instead of giving
    # it a domain of its own, include deploy/nginx-subpath.conf in that site's
    # server block rather than using this file.

    location / {
        proxy_pass http://tinysonic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio streams are long-lived responses. Do not buffer them to disk,
        # and allow long pauses between chunks.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
