# Fail2ban filter for tinysonic. Matches the failures that point to an
# attack (#186):
#
#   WARN auth failed ip=198.51.100.7 reason=password path=/rest/ping
#
# reason=password      a wrong password for an existing account
# reason=unknown-user  a password for an account that does not exist
# reason=rate-limit    an address that kept trying after it was limited
# reason=key_unknown   an API key that never existed (guessing)
#
# Routine refusals are logged in the same form but not matched: an expired,
# idle or revoked key (an old phone still polling), an expired or signed-out
# session, a pending or disabled account, and server_busy. Banning on those
# would lock out a user whose app simply needs pairing again.
#
# The log holds no username, password or key. Install as
# /etc/fail2ban/filter.d/tinysonic.conf.

[Definition]
failregex = ^.*\bauth failed ip=<HOST> reason=(?:password|unknown-user|rate-limit|key_unknown) path=\S+
ignoreregex =
