# Fail2ban filter for tinysonic. Matches the event written for every failed
# password attempt, including unknown usernames and rate-limited attempts:
#
#   WARN auth failed ip=198.51.100.7 reason=password path=/rest/ping
#
# The log holds no username or password. Install as
# /etc/fail2ban/filter.d/tinysonic.conf.

[Definition]
failregex = ^.*\bauth failed ip=<HOST> reason=\S+ path=\S+
ignoreregex =
