<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinysonic sign in</title>
<link rel="stylesheet" href="static/login.css">
</head>
<body>
<main>
  <h1>Sign in to tinysonic</h1>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username webauthn" autocapitalize="none">
  <button id="passkey">Sign in with a passkey</button>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="pw" class="secondary">Sign in with password</button>
  <button id="sso" class="secondary" hidden>Sign in with single sign-on</button>
  <details id="reg">
    <summary>Register with an invitation code</summary>
    <label for="ri">Invitation code</label>
    <input id="ri" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="inv-XXXX-XXXX-XXXX-XXXX">
    <label for="ru">Username</label>
    <input id="ru" autocomplete="username" autocapitalize="none">
    <button id="registerPasskey">Create account with a passkey</button>
    <label for="rp">Password (optional, instead of a passkey)</label>
    <input id="rp" type="password" autocomplete="new-password">
    <label for="rp2">Repeat password</label>
    <input id="rp2" type="password" autocomplete="new-password">
    <button id="register" class="secondary">Create account with a password</button>
    <button id="registerSSO" class="secondary" hidden>Create account with single sign-on</button>
  </details>
  <div id="msg" role="status"></div>
</main>
<script src="static/login.js"></script>
</body>
</html>
